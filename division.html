<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Algoritmo da Divisão: o Assembly da Matemática</title>
  <script src="js/boot.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/studio.css">
  <style>
    .division-grid { display: grid; grid-template-columns: 1fr 400px; gap: 24px; padding: 24px; height: 100%; }
    .work-area { background: var(--stage); border: 1.5px solid var(--line); border-radius: var(--r); padding: 32px; display: flex; flex-direction: column; gap: 24px; }
    .division-step-visual {
      font-family: var(--mono);
      font-size: 1.8em;
      padding: 40px;
      background: #ffffff;
      border-radius: var(--r-sm);
      color: var(--ink);
      min-height: 550px;
      overflow: auto;
      border: 1px solid var(--line);
    }
    .math-table { border-collapse: collapse; margin-left: 50px; }
    .math-table td { width: 1.2ch; height: 1.2em; text-align: center; padding: 0; position: relative; }
    .chave-v { border-left: 3px solid var(--ink); }
    .chave-h { border-top: 3px solid var(--ink); color: var(--ok-ink); font-weight: bold; text-align: left !important; padding-left: 10px !important; }
    .divisor-cell { text-align: left !important; padding-left: 10px !important; }
    .sub-val { color: var(--pen-ink); }
    .sub-bar { border-bottom: 2px solid var(--ink-3); }
    .status-box { padding: 24px; border-left: 8px solid var(--blue); background: #f0f7ff; font-size: 1.15em; color: var(--ink); min-height: 100px; }
    .setup-controls input { width: 140px; font-size: 1.2em; border: 1px solid var(--line); padding: 8px; border-radius: 4px; }
    .register-view { font-family: var(--mono); background: var(--ink); color: #aff5b4; padding: 24px; border-radius: var(--r); }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="brand"><h1>Algoritmo da Divisão</h1><p>estudo passo a passo</p></div></header>
    <main class="workspace" style="grid-template-columns: 1fr;">
      <section class="stage">
        <div class="division-grid">
          <div class="work-area">
            <div class="setup-controls">
              <input type="number" id="dividendo" value="816">
              <input type="number" id="divisor" value="8">
              <button class="btn btn-marker" id="btn-load">CARREGAR</button>
              <button class="btn btn-primary" id="btn-next">PRÓXIMO (F8)</button>
            </div>
            <div class="division-step-visual" id="visual"></div>
            <div class="status-box" id="status">Iniciado.</div>
          </div>
          <div class="register-view">
             <div style="color: var(--marker); margin-bottom: 20px;">// REGISTRADORES</div>
             <div class="reg-line">D_RAW: <span id="reg-D">0</span></div>
             <div class="reg-line">d_VAL: <span id="reg-d">0</span></div>
             <div class="reg-line">q_ACC: <span id="reg-q">0</span></div>
             <div class="reg-line">R_VAL: <span id="reg-R">0</span></div>
             <div id="formula" style="margin-top: 20px; font-size: 0.9em; padding-top: 20px; border-top: 1px solid var(--ink-2);"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="js/division/main.js"></script>
</body>
</html>
